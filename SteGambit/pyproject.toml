[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegambit"
version = "0.1.0"
description = "Multi-format steganography tool with Defense-in-Depth"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
    "jpeglib>=1.0.0",
    "scikit-image>=0.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1",
    "pytest-html>=4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "smoke: critical end‑to‑end scenarios",
    "integration: tests involving multiple modules",
    "io: tests touching real file system / external libraries",
    "smoke: критичные сценарии, прогоняются всегда",
    "slow: тесты дольше 1 секунды",
    "integration: тесты с реальным I/O и полным pipeline",
    "load: Нагрузочные, с большими файлами (скипается по умолчанию, но можно запустить по марке -m load)"
]
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=src/stegambit/core",
    "--cov=src/stegambit/services",
    "--cov=src/stegambit/models",
    "--cov-report=term-missing",
    "--cov-report=html:docs/testing/coverage",
    "--html=docs/testing/report.html",
    "--self-contained-html",
]

[project.gui-scripts]
stegambit = "stegambit.gui.main_window:main"