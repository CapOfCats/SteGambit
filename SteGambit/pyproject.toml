[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stegambit"
version = "0.1.0"
description = "Multi-format steganography tool with Defense-in-Depth"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5.0",
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "imageio>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]

[project.gui-scripts]
stegambit = "stegambit.gui.main_window:main"